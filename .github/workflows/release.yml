name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: 27.2.12479018

jobs:
  linux:
    name: build tun_linux_${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: x86_64
            runner: ubuntu-24.04
          - artifact: arm64
            runner: ubuntu-24.04-arm

    env:
      CFLAGS: -Os -ffunction-sections -fdata-sections -Wl,--gc-sections

    steps:
      - uses: actions/checkout@v4

      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build static binary
        run: |
          musl-gcc $CFLAGS -static -s -pthread tun.c -o tun_linux_${{ matrix.artifact }}
          file tun_linux_${{ matrix.artifact }}

      - name: Checksum
        run: sha256sum tun_linux_${{ matrix.artifact }} | tee tun_linux_${{ matrix.artifact }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tun_linux_${{ matrix.artifact }}
          path: |
            tun_linux_${{ matrix.artifact }}
            tun_linux_${{ matrix.artifact }}.sha256

      - name: Attach to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tun_linux_${{ matrix.artifact }}
            tun_linux_${{ matrix.artifact }}.sha256
          fail_on_unmatched_files: true

  macos:
    name: build tun_macos_${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15

    env:
      CFLAGS: -Os -ffunction-sections -fdata-sections -Wl,-dead_strip

    steps:
      - uses: actions/checkout@v4

      - name: Build macOS binary
        run: |
          cc $CFLAGS tun.c -o tun_macos_${{ matrix.arch }}
          strip tun_macos_${{ matrix.arch }}
          file tun_macos_${{ matrix.arch }}

      - name: Checksum
        run: shasum -a 256 tun_macos_${{ matrix.arch }} | tee tun_macos_${{ matrix.arch }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tun_macos_${{ matrix.arch }}
          path: |
            tun_macos_${{ matrix.arch }}
            tun_macos_${{ matrix.arch }}.sha256

      - name: Attach to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tun_macos_${{ matrix.arch }}
            tun_macos_${{ matrix.arch }}.sha256
          fail_on_unmatched_files: true

  windows:
    name: build tun_windows_${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            cc: x86_64-w64-mingw32-gcc
          - arch: i686
            cc: i686-w64-mingw32-gcc

    env:
      CFLAGS: -Os -ffunction-sections -fdata-sections -Wl,--gc-sections

    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-mingw-w64-i686

      # -lws2_32 must follow tun.c: ld resolves left to right and drops a
      # library placed before the object that references it.
      - name: Build Windows binary
        run: |
          ${{ matrix.cc }} $CFLAGS -static -s tun.c -o tun_windows_${{ matrix.arch }}.exe -lws2_32
          file tun_windows_${{ matrix.arch }}.exe

      - name: Checksum
        run: sha256sum tun_windows_${{ matrix.arch }}.exe | tee tun_windows_${{ matrix.arch }}.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tun_windows_${{ matrix.arch }}
          path: |
            tun_windows_${{ matrix.arch }}.exe
            tun_windows_${{ matrix.arch }}.exe.sha256

      - name: Attach to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tun_windows_${{ matrix.arch }}.exe
            tun_windows_${{ matrix.arch }}.exe.sha256
          fail_on_unmatched_files: true

  android:
    name: build tun_android_*
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;$NDK_VERSION"

      # Bionic, not glibc: the NDK toolchain is the only supported way to build
      # for Android. Binaries stay dynamically linked (no -static) because bionic
      # rejects static executables on ARM/ARM64 below API 29.
      - name: Build Android binaries
        run: |
          make ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" android
          for f in tun_android_*; do
            file "$f"
            readelf -h "$f" | grep -E 'Class|Type|Machine'
            readelf -l "$f" | grep -A1 'INTERP' | tail -1
          done

      - name: Checksum
        run: |
          for f in tun_android_*; do
            sha256sum "$f" | tee "$f.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tun_android
          path: |
            tun_android_*
            !tun_android_*.sha256
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: tun_android_sha256
          path: tun_android_*.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: tun_android_*
          fail_on_unmatched_files: true
